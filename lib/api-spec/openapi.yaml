        userId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [scheduled, active, completed, cancelled]
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        scheduledFor:
          type: string
          format: date-time
          nullable: true
        logs:
          type: array
          items:
            $ref: "#/components/schemas/SessionLogEntry"
        setNotes:
          type: array
          items:
            $ref: "#/components/schemas/SetNoteEntry"
      required:
        - id
        - planId
        - planName
        - status
        - logs
        - setNotes

    UpdateSessionStatusResponse:
      type: object
