        sessionId:
          type: integer
        planSetId:
          type: integer
        exerciseId:
          type: integer
          nullable: true
        exerciseName:
          type: string
          nullable: true
        exerciseMeasurementType:
          type: string
          enum: [reps, seconds, meters]
          nullable: true
        roundNumber:
          type: integer
        weight:
          type: number
          nullable: true
        value:
          type: number
          nullable: true
        setDescription:
          type: string
          nullable: true
      required:
        - id
        - sessionId
        - planSetId
        - roundNumber

    SessionDetail:
      type: object
